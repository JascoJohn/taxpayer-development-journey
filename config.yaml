# ---------------------------------------------------------------------------------------------------------------------
# Assumptions ledger (Block C, W12). Every constant that feeds a claim in docs/claims_map_draft.csv or a value the dashboard
# displays. The model reads each one with assumptions.A("key") (src/assumptions.py); there is no typed copy in the code.
#   basis: DATA (traced to a file or a verified published source) | LITERATURE (full reference, verified) |
#          ASSUMPTION (a design or scenario choice, with its rationale) | UNKNOWN (no stated basis; a claim it feeds is BLOCKED).
#   group: the model function re-run by the sensitivity analysis. Values are unchanged from the former typed constants.
# `docs/assumptions_register.csv` is generated from this block (src/tools/build_assumptions_register.py).
# ---------------------------------------------------------------------------------------------------------------------
assumptions:
  macro.gdp_usd:
    basis: DATA
    from: "outputs/stats/macro_inputs.json"
    source: "GDP, current US$ (WDI NY.GDP.MKTP.CD, latest year 2024): outputs/stats/macro_inputs.json tanzania.gdp_usd. Replaced the typed 78,844,405,385."
    feeds: "C003, C005, C010"
    group: macro
  macro.tzs_per_usd:
    basis: DATA
    from: "outputs/stats/macro_inputs.json"
    source: "Official exchange rate, LCU per US$, period average (WDI PA.NUS.FCRF, 2024): macro_inputs.json tanzania.fx_tzs_per_usd. Replaced the typed 2,500."
    feeds: "C005, C010"
    group: macro
  macro.tax_to_gdp_current:
    basis: DATA
    from: "outputs/stats/macro_inputs.json"
    source: "Tax revenue % of GDP, Tanzania, latest year 2024 (WDI GC.TAX.TOTL.GD.ZS): macro_inputs.json tanzania.tax_to_gdp_pct. Replaced the typed 0.128."
    feeds: "C003, C005, C010, C011"
    group: macro
  macro.tax_to_gdp_target:
    basis: DATA
    from: "outputs/stats/macro_inputs.json"
    source: "Benchmark = simple mean of GHA, KEN, RWA, UGA tax-to-GDP in 2023, the latest year all five countries report (macro_inputs.json benchmark.benchmark_pct); policy switch macro.benchmark_source. Replaced the typed 0.165."
    feeds: "C003, C005, C010, C079"
    group: macro
  base.gdp_growth_rate:
    basis: DATA
    from: "data/processed/twin_inputs.json"
    data_file: twin_inputs
    data_path: "parameters.base_gdp_growth_rate.value"
    source: "GDP growth: mean of the last 5 years of World Bank WDI NY.GDP.MKTP.KD.ZG (annual %), Tanzania. Replaced the typed 5.53% (UNKNOWN)."
    feeds: "C079 (Fig 5.2 digital twin)"
    group: twin
  base.population:
    basis: DATA
    from: "data/processed/twin_inputs.json"
    data_file: twin_inputs
    data_path: "parameters.base_population.value"
    source: "Census 2022 10% sample total (x10: 61.7 million) projected to the base year 2024 with the mean WDI population growth SP.POP.GROW. Replaced the typed 68,560,157 (UNKNOWN)."
    feeds: "C079 (Fig 5.2 digital twin)"
    group: twin
  base.working_age_population:
    basis: DATA
    from: "data/processed/twin_inputs.json"
    data_file: twin_inputs
    data_path: "parameters.base_working_age_population.value"
    source: "Census 2022 10% sample, ages 15-64 (x10), projected to 2024 with the same growth. Replaced the typed 28,000,000 (UNKNOWN)."
    feeds: "C079 (Fig 5.2 digital twin)"
    group: twin
  base.registered_taxpayers:
    basis: DATA
    from: "data/processed/twin_inputs.json"
    data_file: twin_inputs
    data_path: "parameters.base_registered_taxpayers.value"
    source: "TRA registered taxpayers (Mainland TIN registrations, stock at the end of fiscal year 2023/24: 6,272,000), NBS Tax Statistics Report 2023/24 Table 3.1 (source TRA); series 2011/12-2023/24 in data/processed/tra_registered_taxpayers.csv. NOT comparable with FinScope's 1.31 million adult TIN holders. Replaced the typed 3,200,000 (UNKNOWN)."
    feeds: "C079 (Fig 5.2 digital twin)"
    group: twin
  base.mobile_money_users:
    basis: DATA
    from: "data/processed/twin_inputs.json"
    data_file: twin_inputs
    data_path: "parameters.base_mobile_money_users.value"
    source: "FinScope Tanzania 2023, weighted number of ADULTS (16+) who use mobile money (about 24.5 million, 71.7% of adults): persons, not accounts, computed in the pipeline (src/03_features/twin_inputs.py). Bank of Tanzania ACTIVE accounts (63.2 million in 2024) are kept as a context figure only (Block E3.3). Replaced the typed 35,000,000 (UNKNOWN) and, in Block E2, the BoT account count."
    feeds: "C079 (Fig 5.2 digital twin)"
    group: twin
  base.mobile_money_gdp_pct:
    basis: DATA
    from: "data/processed/twin_inputs.json"
    data_file: twin_inputs
    data_path: "parameters.base_mobile_money_gdp_pct.value"
    source: "Value of mobile payments 2024 (BoT: TZS 198.86 trillion) divided by nominal GDP 2024 (WDI NY.GDP.MKTP.CN); a gross flow over GDP (0.97). Replaced the typed 0.49 (UNKNOWN)."
    feeds: "C079 (Fig 5.2 digital twin)"
    group: twin
  base.new_taxpayer_mean_tax_tzs:
    basis: DATA
    from: "data/processed/twin_inputs.json"
    data_file: twin_inputs
    data_path: "parameters.base_new_taxpayer_mean_tax_tzs.value"
    source: "Mean statutory income tax per new taxpayer in the twin (Block F1): the resident individual schedule (non-owners) and the presumptive schedule (business owners; Finance Act 2026) applied to the DISTRIBUTION (100 quantile cells) of ILFS 2024 annual earnings of informal earners (src/04_models/statutory_tax.py). Replaces the flat 15% rate on the mean (retired)."
    feeds: "C079 (Fig 5.2 digital twin)"
    group: twin
  base.msme_mean_presumptive_tax_tzs:
    basis: DATA
    from: "data/processed/twin_inputs.json"
    data_file: twin_inputs
    data_path: "parameters.base_msme_mean_presumptive_tax_tzs.value"
    source: "Mean presumptive tax per household enterprise (Block F1): the presumptive schedule applied to the DISTRIBUTION (100 quantile cells) of ILFS 2024 annual gross receipts of non-agricultural self-employed with turnover. Replaces the flat 3% rate on mean receipts (retired)."
    feeds: "C079 (Fig 5.2 digital twin)"
    group: twin
  base.informal_worker_avg_income_tzs:
    basis: DATA
    from: "data/processed/twin_inputs.json"
    data_file: twin_inputs
    data_path: "parameters.base_informal_worker_avg_income_tzs.value"
    source: "ILFS 2024: weighted mean annual earnings of employed persons in informal employment with positive earnings (median in data/processed/twin_inputs.json). Replaced the typed 2,400,000 (UNKNOWN)."
    feeds: "C079 (Fig 5.2 digital twin); C062 (tier-migration percentages), dashboard Enterprise page (tier chart)"
    group: twin
  base.msme_avg_revenue_tzs:
    basis: DATA
    from: "data/processed/twin_inputs.json"
    data_file: twin_inputs
    data_path: "parameters.base_msme_avg_revenue_tzs.value"
    source: "ILFS 2024: weighted mean annual gross receipts of self-employed persons in non-agricultural main jobs, winsorised at the 99th percentile; describes household enterprises, not registered MSMEs (no published MSME revenue figure was found). Replaced the typed 12,000,000 (UNKNOWN)."
    feeds: "C079 (Fig 5.2 digital twin)"
    group: twin
  tax_morale.baseline.trust:
    basis: DATA
    from: "data/processed/afrobarometer_morale.json"
    data_file: afrobarometer_morale
    data_path: "baseline_scores.trust.value"
    source: "Starting score (0-1) of the trust driver, from Afrobarometer Round 8 Tanzania 2021 (variable Q41J: trust in the tax/revenue office), weighted mean of the item rescaled to 0-1 (withinwt_hh), computed in src/03_features/afrobarometer_morale.py with a 95% CI in the file. Replaced the typed 0.35 (UNKNOWN). Mapping rationale in config.yaml afrobarometer.baseline_mapping."
    feeds: "C008, C054, C055, C069, C078 ({FIG51}); C079 (Fig 5.2 digital twin)"
    group: morale
  tax_morale.baseline.simplicity:
    basis: DATA
    from: "data/processed/afrobarometer_morale.json"
    data_file: afrobarometer_morale
    data_path: "baseline_scores.simplicity.value"
    source: "Starting score (0-1) of the simplicity driver, from Afrobarometer Round 8 Tanzania 2021 (variable Q46A: how easy or difficult to find out what taxes and fees you are supposed to pay), reversed and rescaled 0-1, weighted mean (withinwt_hh), computed in src/03_features/afrobarometer_morale.py. LABEL: information burden only (does not cover registration or filing costs). Mapping decided by the owner in Block E2.0; replaced the typed 0.25."
    feeds: "C008, C054, C055, C069, C078 ({FIG51}); C079 (Fig 5.2 digital twin)"
    group: morale
  tax_morale.baseline.enforcement:
    value: 0.4
    basis: ASSUMPTION
    source: "Starting score (0-1) of the enforcement driver. No defensible measure found (Block E2.1): no Afrobarometer, FinScope or ILFS item asks about the likelihood of audit, detection or penalty for not paying or registering, and the TRA publications reachable give only an audit-yield share of revenue (17.0% baseline, 14.5% actual 2022/23, TRA Sixth Corporate Plan p. 48) and no audit coverage rate. Closest item Q40G (ordinary people who break the law go unpunished) is general, not about tax. Kept at the former typed 0.40 as an ASSUMPTION for the owner's sign-off; the full search list is in config.yaml afrobarometer.baseline_mapping.enforcement."
    feeds: "C008, C054, C055, C069, C078 ({FIG51}); C079 (Fig 5.2 digital twin)"
    group: morale
    signoff: "approved (John, 2026-11-12)"
  tax_morale.baseline.social_norm:
    basis: DATA
    from: "data/processed/afrobarometer_morale.json"
    data_file: afrobarometer_morale
    data_path: "baseline_scores.social_norm.value"
    source: "Starting score (0-1) of the social norm driver, from Afrobarometer Round 8 Tanzania 2021 (variable Q47D: perceived behaviour of others (how often people avoid paying the taxes they owe), reversed), weighted mean of the item rescaled to 0-1 (withinwt_hh), computed in src/03_features/afrobarometer_morale.py with a 95% CI in the file. Replaced the typed 0.3 (UNKNOWN). Mapping rationale in config.yaml afrobarometer.baseline_mapping."
    feeds: "C008, C054, C055, C069, C078 ({FIG51}); C079 (Fig 5.2 digital twin)"
    group: morale
  tax_morale.baseline.fairness:
    basis: DATA
    from: "data/processed/afrobarometer_morale.json"
    data_file: afrobarometer_morale
    data_path: "baseline_scores.fairness.value"
    source: "Starting score (0-1) of the fairness driver, from Afrobarometer Round 8 Tanzania 2021 (variable Q47C: the government usually uses tax revenues for the well-being of citizens), weighted mean of the item rescaled to 0-1 (withinwt_hh), computed in src/03_features/afrobarometer_morale.py with a 95% CI in the file. Replaced the typed 0.3 (UNKNOWN). Mapping rationale in config.yaml afrobarometer.baseline_mapping."
    feeds: "C008, C054, C055, C069, C078 ({FIG51}); C079 (Fig 5.2 digital twin)"
    group: morale
  tax_morale.weight.trust:
    value: 0.3
