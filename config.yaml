      nps_2024: {title: "Bank of Tanzania, Payment Systems Annual Report for 2024", file: "data/raw/bot/nps_annual_report_2024.pdf", url: "https://www.bot.go.tz/Publications/Regular/Annual%20Report/en/2025032515311662.pdf", table: "mobile payments, 2024 (value TZS 198,859.29 billion)"}
    users_active:                     # year: number
      2018: 23302040
