# E2.4: calibration of the agent simulation to TRA's registered-taxpayer trend (src/04_models/agent_calibration.py)
agent_calibration:
  n_agents: 100000                       # agents in each calibration run (the published simulations use simulation.n_agents)
  years: 6                               # fiscal years 2018/19 - 2023/24 against the 2017/18 start
  starts: [[-2.0, 0.0], [-3.0, 0.3], [-1.0, -0.2]]      # Nelder-Mead starting points: (log10 conversion rate, intercept)
  log10_conversion_bounds: [-5.0, 0.0]
  intercept_bounds: [-1.0, 1.0]
  max_iter: 200
  rmse_ok_pp: 0.25                       # the fit is accepted if the RMSE is at most this many percentage points
  profile_offsets:
    log10_conversion: [-0.6, -0.3, -0.1, 0.0, 0.1, 0.3, 0.6]
    intercept: [-0.3, -0.1, -0.03, 0.0, 0.03, 0.1, 0.3]
  third_target_search:                   # Block E3.2 (searched 2026-11-12): no independent target with a compatible definition was found; the two-target calibration is kept
    result: "no third target integrated"
    searched:
      - "FinScope Tanzania 2017 published adult TIN-holding rate: the 2017 questionnaire (FSDT, final 19 April 2017) asks the document question Q27 with code 13 'Tax identification number', the same item as the 2023 variable c27__13, but the published 2017 report 'FinScope Tanzania 2017: Insights that Drive Innovation' (FSDT, 2017) prints no TIN rate: it reports national, voter, TASAF and Zanzibar resident ID (p. 26: 84% of adults hold at least one form of identification) and mobile-money uptake (60% of adults, p. 43). A 2017 level would need the FinScope 2017 microdata, which the project does not hold and which would need a separate data-sharing request to FSDT / NBS."
      - "A TRA or NBS split of registrations into individuals and entities: NBS Tax Statistics Reports 2022/23 and 2023/24 (Table 3.1) give only the total and VAT-registered counts; the TRA Sixth Corporate Plan gives active and dormant BUSINESS TINs for 2020/21, 2021/22 and 2022/23 only (three points, with a definition change in 2022/23, 3.34M to 1.66M); no individual / entity split found."
      - "Yearly NEW registrations (flow): no TRA or NBS publication found with a flow series. A press report of TRA's third-quarter 2025/26 results (900,755 new registrations in nine months; register 8,245,704 at 31 March 2026) exists but is a news item outside the calibration window (2017/18-2023/24), not a TRA document, and is not used."
    kept: "two parameters (agents.conversion_rate, agents.p_comply.intercept) against the six TRA-index points; the identified combination conversion x (mean index + intercept) is reported in identifiability.identified_combination"
  sanity:                                # flags only: results above these bounds are reported, never tuned away
    platinum_share_pct_max: 5.0
    year10_registered_share_vs_trend: 1.0    # year-10 registered share above the TRA trend continued for 10 years (x this factor)

# E2.5: Table 40 stage economics (src/04_models/stage_economics.py); the uncertain inputs are assumptions: stage.* below
# Editing Pass 1 (2026-11-13): the single source of truth for the names of the six stage tools and of the platform. Read by stage_economics.py (Table 40 names), the
# intervention register (docs/interventions.yaml uses the same strings), dashboard/tdj_lib/names.py (every page, card, caption and generated PDF), the figure scripts and the report
# renaming tests. `full` is the first-mention form (Swahili name with the English in brackets); `swahili` is the running form; `english` is the English descriptor alone.
names:
  seed:       {swahili: "Michezo ya Kodi",         english: "Tax Learning Games",                  full: "Michezo ya Kodi (Tax Learning Games)"}
  entry:      {swahili: "Ujumuishaji wa Kikodi",   english: "Taxpayer Targeting and Registration Tool", full: "Ujumuishaji wa Kikodi (Taxpayer Targeting and Registration Tool)"}
  active:     {swahili: "Mzani wa Kodi",           english: "Presumptive Tax Estimator",           full: "Mzani wa Kodi (Presumptive Tax Estimator)"}
  enterprise: {swahili: "Hatua za Kodi",           english: "Tax Progression Dashboard",           full: "Hatua za Kodi (Tax Progression Dashboard)"}
  asset:      {swahili: "Mali-Alama za Kodi",      english: "Tax Asset Score",                     full: "Mali-Alama za Kodi (Tax Asset Score)"}
  legacy:     {swahili: "Urithi wa Kodi",          english: "Tax Legacy Score",                    full: "Urithi wa Kodi (Tax Legacy Score)"}
  platform:   {swahili: "Jukwaa la Ngazi",         english: "Ngazi Platform",                      full: "Ngazi Platform (Jukwaa la Ngazi)"}

stage_economics:
  n_draws: 10000
  seed: 20260112
  long_horizon_years: 20                 # E3.4: 20-year (lifecycle) sensitivity next to the signed-off 10-year horizon
  persistence_sensitivity: [0.75, 0.90, 0.95]   # E3.4: FIXED yearly persistence values for the 20-year results, next to the signed-off triangular distribution (unchanged)
  age_bands: [[16, 19], [20, 24], [25, 29], [30, 34], [35, 39], [40, 44], [45, 49], [50, 54], [55, 59], [60, 64], [65, 69], [70, 97]]   # ILFS age bands of the age-earnings path
  report_names:                          # E3.4 / Editing Pass 1: PDF page and Table 40 row label of each stage's tool in the report; the NAME itself is read from the top-level `names:` block
    seed: {pdf_page: 17, table40_label: "Michezo ya Kodi", morale_model_key: null}
    entry: {pdf_page: 23, table40_label: "Ujumuishaji wa Kikodi", morale_model_key: USSD_registration_nudge}
    active: {pdf_page: 29, table40_label: "Mzani wa Kodi", morale_model_key: presumptive_tax_simplification}
    enterprise: {pdf_page: 35, table40_label: "Hatua za Kodi", morale_model_key: community_compliance_norms}
    asset: {pdf_page: 40, table40_label: "Mali-Alama za Kodi", morale_model_key: visible_tax_returns}
    legacy: {pdf_page: 47, table40_label: "Urithi wa Kodi", morale_model_key: civic_tax_education}

