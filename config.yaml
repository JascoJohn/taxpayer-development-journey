  twin.policy.hypothetical_additional_levy:
    value: 0.003
    basis: ASSUMPTION
    source: "Policy scenario: a HYPOTHETICAL ADDITIONAL levy of 0.3% of the value of mobile-money payments (the twin's mobile_money_gdp_pct x GDP), on top of the levy that already exists. Context (Block F2, docs/mobile_money_levy.md): Tanzania already levies mobile-money transactions under section 46A of the National Payment Systems Act (Cap. 437), a TIERED FIXED FEE per transaction (TZS 10 to TZS 2,000 by value band, GN 596C of 5 October 2022), on cash WITHDRAWALS ONLY since the Finance Act 2023 (1 July 2023); its revenue is already inside the observed tax-to-GDP baseline. No collection figure for the current levy was found, so no effective rate (collections / transaction value) could be derived for it and the lever is not expressed as a change relative to it. The only published collection estimate is for the earlier regime (GSMA: TZS 252 billion in 2022 on BoT mobile payments of TZS 114.3 trillion, about 0.22%, transfers and withdrawals). The 0.3% is a scenario input with no evidence behind it."
    feeds: "C079 (Fig 5.2 digital twin)"
    group: twin
    retired_in: "Editing Pass 1 (P0)"
    retired_reason: "removed by owner: not a framework lever"
  twin.policy.mobile_money_levy:
    value: 0.003
    basis: ASSUMPTION
    source: "Policy scenario: 0.3% levy on mobile-money flows (comparable to the 0.3% Kenya excise noted in the code; not verified)."
    feeds: "C079 (Fig 5.2 digital twin)"
    group: twin
    retired_in: "Block F2"
    retired_reason: "replaced by twin.policy.hypothetical_additional_levy: a mobile-money levy already exists in Tanzania (National Payment Systems Act Cap. 437 s.46A; a tiered fixed fee per transaction, on withdrawals only since 1 July 2023), so a 0.3% levy cannot be called a new policy; no effective rate of the current levy could be derived (no collection figure for the withdrawal-only levy), so the lever is labelled a hypothetical ADDITIONAL levy; see docs/mobile_money_levy.md"
