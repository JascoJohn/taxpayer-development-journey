    group: twin
    signoff: "approved (John, 2026-11-12)"
  twin.mm.penetration_gap_closure:
    value: 0.10
    basis: ASSUMPTION
    source: "Share of the remaining gap between mobile-money penetration and its cap that closes each year (0.10, i.e. about 1.8 percentage points a year from 71.7% toward 90%). A structural assumption of the twin, not measured. NEW in Block E3.3, not yet signed off."
