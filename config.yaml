# Project configuration - The Taxpayer Development Journey (Behavioral)
# All paths are relative to the project root (the folder holding this file) and use "/".
# src/paths.py reads this file; no script uses the working directory.

# Disclosure rule (Block D1), read by every publishing step (src/disclosure.py); no threshold is hard-coded elsewhere.
#   min_base: a cell with fewer unweighted respondents than this is suppressed (estimate and count set to null).
#   low_precision_numerator: a cell with base >= min_base but fewer unweighted numerator cases than this is flagged low precision.
disclosure:
  min_base: 10
  low_precision_numerator: 10

project:
  name: taxpayer-development-journey
  title: "The Taxpayer Development Journey — A Behavioral Lifecycle Architecture for Tax Compliance: Evidence from Tanzania"

# Seeds and simulation sizes. Values are those hard-coded in the original scripts
# (economic_model.py, finscope_targeting_population_loader.py, run_all.py).
simulation:
  random_seed: 42      # economic_model.RANDOM_SEED; targeting loader uses the same value (+2, +4 offsets in code)
  n_agents: 500000     # agent-based and tier-migration simulations
  n_years: 10          # simulation horizon in years

# Age band of the Seed stage (inclusive). Every script and label reads it from here; Entry starts at seed_age_band[1] + 1.
# Decision: 6-15 (not 6-18). The 2022 Census 10% sample counts it (src/03_features/census_population.py).
seed_age_band: [6, 15]

# World Bank WDI (CC BY 4.0). The API is called ONLY by `run_all.py --fetch` (src/01_ingest/fetch_worldbank.py); the analysis reads
# the snapshot files named under `snapshots` below. Raw responses are saved unchanged; MANIFEST.csv records URL, time and SHA-256.
worldbank:
  api_base: https://api.worldbank.org/v2
  snapshot_dir: data/raw/worldbank
  manifest: data/raw/worldbank/MANIFEST.csv
  years: "1960:2026"              # all available years
  series:
    - {indicator: GC.TAX.TOTL.GD.ZS, countries: [TZA, GHA, KEN, RWA, UGA]}   # tax revenue, % of GDP
    - {indicator: NY.GDP.MKTP.CN,    countries: [TZA]}                       # GDP, current LCU (TZS)
    - {indicator: NY.GDP.MKTP.CD,    countries: [TZA]}                       # GDP, current US$ (only where a US$ figure is reported)
    - {indicator: PA.NUS.FCRF,       countries: [TZA]}                       # official exchange rate, LCU per US$, period average
    - {indicator: NY.GDP.MKTP.KD.ZG, countries: [TZA]}                       # GDP growth, annual % (Block E2: digital-twin base parameter)
    - {indicator: SP.POP.GROW,       countries: [TZA]}                       # population growth, annual % (Block E2)
    - {indicator: SP.POP.TOTL,       countries: [TZA]}                       # population, total (Block E2, context)
  snapshots:                      # the snapshot the analysis reads, per indicator (set after a --fetch)
    GC.TAX.TOTL.GD.ZS: data/raw/worldbank/GC.TAX.TOTL.GD.ZS_2026-11-12.json
    NY.GDP.MKTP.CN: data/raw/worldbank/NY.GDP.MKTP.CN_2026-11-12.json
    NY.GDP.MKTP.CD: data/raw/worldbank/NY.GDP.MKTP.CD_2026-11-12.json
    PA.NUS.FCRF: data/raw/worldbank/PA.NUS.FCRF_2026-11-12.json
    NY.GDP.MKTP.KD.ZG: data/raw/worldbank/NY.GDP.MKTP.KD.ZG_2026-11-12.json
    SP.POP.GROW: data/raw/worldbank/SP.POP.GROW_2026-11-12.json
    SP.POP.TOTL: data/raw/worldbank/SP.POP.TOTL_2026-11-12.json

# Macro inputs (src/03_features/macro_inputs.py -> outputs/stats/macro_inputs.json)
macro:
  country: TZA
  peers: [GHA, KEN, RWA, UGA]
  # benchmark policy: peer_average (default; simple mean of the peers in the latest year all five countries report)
  #                   | cited_target (a published Tanzanian target; none adopted yet, see _archive/process_records/BLOCK_C_REPORT.md)
  benchmark_source: peer_average
  cited_target_pct: null          # fill only together with cited_target_source when a citable target is adopted
  cited_target_source: null
  # Context only (Block D0.3): the MoF tax-to-GDP target for 2026/27. Written to macro_inputs.json; NOT used in the gap.
  context_target_pct: 13.5
  context_target_source: "Ministry of Finance, Tanzania, 'Guideline for the Preparation of Government Plan and Budget for the Medium Term 2026/27-2028/29', 17 June 2026, printed p. 8: 'Tax revenue to GDP ratio to reach 13.5 percent in 2026/27 and an average of 13.6 percent over the medium term'. https://www.mof.go.tz/uploads/documents/en-1781678091-GUIDELINE%20FOR%20THE%20PREPARATION%20OF%20GOVERNMENT%20PLAN%20AND%20BUDGET%20FOR%20THE%20MEDIUM%20TERM%202026.27-2028.29.pdf"

# Real-data targeting model (Block D3, src/04_models/targeting_model.py). All seeds and hyper-parameters live here.
targeting:
  seeds: {split: 20230601, cv: 20230602, model: 20230603, bootstrap: 20230604, agents: 20230605}
  test_size: 0.20
  cv_folds: 5
  cv_repeats: 3                      # repeated stratified 5-fold CV on the training set
  logistic:
    c_grid: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1]
    max_iter: 2000
  gradient_boosting: {max_depth: 3, learning_rate: 0.05, max_iter: 200, l2_regularization: 1.0, min_samples_leaf: 40}
  permutation_repeats: 5
  permutation_candidates: 40         # columns (highest single-feature AUC on the training set) whose permutation importance is reported for boosting
  label_search_terms: ['\btax', '\bTIN\b', '\bTRA\b', 'revenue authority', 'registration', 'registered', 'licen[cs]e', 'permit', '\bVAT\b', 'receipt', 'identity', 'national id', 'passport', 'voter', 'pay ?slip', 'invoice', 'ledger', 'bookkeep', 'record']
  bootstrap_replicates: 500
  scoring_card_C: 1.0
  feature_rules:
    max_levels: 30                   # categorical columns with more levels are excluded (free-form / codes)
    min_level_share: 0.005           # levels held by under 0.5% of respondents get no indicator
    constant_share: 0.995            # near-constant columns are excluded
    max_single_feature_auc: 0.90     # a single feature with weighted AUC above this is treated as mechanically tied to the outcome
  agent_age_bands: [[16, 24], [25, 34], [35, 44], [45, 54], [55, 64], [65, 90]]
  variants_c_grid: [0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0, 100.0]   # the small variants need weaker regularisation than the 1,294-feature model
  # E1: restricted variants (same outcome, population, split, CV design, seeds and metrics as the survey model)
  variants:
    core:
      label: "CORE: age, sex, region, urban/rural"
      features: [c8c, c9, reg_name, clustertype]
    extended:
      label: "EXTENDED: CORE + mobile-money use + business ownership / main income source"
      features: [c8c, c9, reg_name, clustertype, MM, BusO, IncomeMain]
  feature_obtainability:      # why TRA can, or cannot, obtain each variant feature
    c8c:
      name: age
      core: true
      obtainable_by_tra: "yes - date of birth is on the National ID (NIDA) record that TRA already matches against TIN applications (TAA s. 23(1): TIN issued for identification and cross-checking)"
    c9:
      name: sex
      core: true
      obtainable_by_tra: "yes - recorded on the National ID (NIDA) record and on the TIN application"
    reg_name:
      name: region of residence
      core: true
      obtainable_by_tra: "yes - residential or business address on the TIN registration and NIDA record; for adults without a TIN, through NIDA data sharing"
    clustertype:
      name: urban / rural residence
      core: true
      obtainable_by_tra: "derivable - not a register field; it follows from the address (ward or enumeration area) using NBS's urban/rural classification of areas"
    MM:
      name: mobile-money use
      core: false
      obtainable_by_tra: "only through a data-sharing agreement with the mobile-money operators or the Bank of Tanzania (operators hold it, TRA does not); SIM registration by National ID is what would link it to a person; no such agreement is assumed to exist"
    BusO:
      name: business ownership
      core: false
      obtainable_by_tra: "partly - business licences (local authorities, BRELA) and TRA's own registrations show formal owners; owners of informal businesses with neither are invisible to TRA, and they are the group of interest"
    IncomeMain:
      name: main income source
      core: false
      obtainable_by_tra: "partly - PAYE records show salaried employment; self-employment, farming and casual work are not observed by TRA unless registered"
  # E3: levels recalibrated by age band (intercept shift on the logit scale; ranking unchanged)
  calibration:
    by: agent_age_bands
    tolerance: 1.0e-10
    max_iter: 200

# W10 / E4: tax morale components from Afrobarometer Round 8, Tanzania (components only; no composite).
afrobarometer:
  round: 8
  country: Tanzania
  weight: withinwt_hh
  weight_note: "withinwt_hh: within-country weight to household level ('new AB withinwt'), adjusting for region, gender, urban-rural distribution and size of household, enumeration area and number of adults (codebook note); withinwt_ea (weights to EA level) is the alternative. Chosen because it includes household selection."
  citation: "Afrobarometer Data, Tanzania, Round 8, 2021, available at http://www.afrobarometer.org (form required by the Afrobarometer data usage and access policy, https://www.afrobarometer.org/data/data-usage-and-access-policy/)"
  indicators:
    - id: civic_duty_always_pay
      group: civic_duty
      variable: Q76E_TAN
      codes: [3]
      code_labels: "1=Never do, 2=Do only if they choose, 3=Always do, 8=Refused, 9=Don't know"
      meaning: "Good citizens should ALWAYS pay the taxes they owe (civic duty to pay tax)"
      question: "For each of the following actions, please tell me whether you think it is something a good citizen in a democracy should always do, never do, or do only if they choose: Good citizens should pay taxes they owe to the government (Tanzania-specific item Q76e-tan; wording from the Tanzania Round 8 codebook)"
    - id: civic_duty_tax_authority_right
      group: civic_duty
      variable: Q39A
      codes: [4, 5]
      code_labels: "1=Strongly disagree, 2=Disagree, 3=Neither agree nor disagree, 4=Agree, 5=Strongly agree, 8=Refused, 9=Don't know"
      meaning: "Agree or strongly agree that the tax authorities always have the right to make people pay taxes"
      question: "For each of the following statements, please tell me whether you disagree or agree: The tax authorities always have the right to make people pay taxes."
    - id: trust_tax_office_a_lot
      group: trust_in_tax_authority
      variable: Q41J
      codes: [3]
      code_labels: "0=Not at all, 1=Just a little, 2=Somewhat, 3=A lot, 8=Refused, 9=Don't know/Haven't heard"
      meaning: "Trusts the tax/revenue office A LOT"
      question: "How much do you trust each of the following, or haven't you heard enough about them to say: The tax/revenue office?"
    - id: trust_tax_office_somewhat_or_a_lot
      group: trust_in_tax_authority
      variable: Q41J
      codes: [2, 3]
      code_labels: "0=Not at all, 1=Just a little, 2=Somewhat, 3=A lot, 8=Refused, 9=Don't know/Haven't heard"
      meaning: "Trusts the tax/revenue office somewhat or a lot"
      question: "How much do you trust each of the following, or haven't you heard enough about them to say: The tax/revenue office?"
    - id: tax_officials_corrupt_most_or_all
      group: trust_in_tax_authority
      variable: Q42G
      codes: [2, 3]
      code_labels: "0=None, 1=Some of them, 2=Most of them, 3=All of them, 8=Refused, 9=Don't know/Haven't heard"
      meaning: "Thinks most or all tax officials are involved in corruption (supporting indicator)"
      question: "How many of the following people do you think are involved in corruption, or haven't you heard enough about them to say: Tax officials?"
    - id: not_paying_acceptable_never_or_if_choose
      group: acceptability_of_not_paying
      variable: Q76E_TAN
      codes: [1, 2]
      code_labels: "1=Never do, 2=Do only if they choose, 3=Always do, 8=Refused, 9=Don't know"
      meaning: "Says good citizens should never pay, or pay only if they choose (does not hold paying tax to be a duty)"
      question: "Q76e-tan, as above (Good citizens should pay taxes they owe to the government)"
    - id: has_refused_to_pay_tax_or_fee
      group: acceptability_of_not_paying
      variable: Q80D_TAN
      codes: [2, 3, 4]
      code_labels: "0=No, would never do this, 1=No, would if had the chance, 2=Yes, once or twice, 3=Yes, several times, 4=Yes, often, 8=Refused, 9=Don't know"
      meaning: "Has refused to pay a tax or fee (once or twice, several times or often)"
      question: "Not published in the codebook (the Tanzania Round 8 codebook carries a placeholder for Q80); the data-file variable label is 'Q80d_tan. Refused to pay a tax or fee' and the answer codes are those shown"
    - id: would_never_refuse_to_pay
      group: acceptability_of_not_paying
      variable: Q80D_TAN
      codes: [0]
      code_labels: "0=No, would never do this, 1=No, would if had the chance, 2=Yes, once or twice, 3=Yes, several times, 4=Yes, often, 8=Refused, 9=Don't know"
      meaning: "Would never refuse to pay a tax or fee"
      question: "Q80d_tan, as above (data-file label 'Refused to pay a tax or fee')"
    - id: others_avoid_tax_often_or_always
      group: perceived_avoidance
      variable: Q47D
      codes: [2, 3]
      code_labels: "0=Never, 1=Rarely, 2=Often, 3=Always, 8=Refused, 9=Don't know"
      meaning: "Thinks people in this country often or always avoid paying the taxes they owe (perceived behaviour of others)"
      question: "In your opinion, how often, in this country, do people avoid paying the taxes that they owe the government?"
    - id: reciprocity_taxes_used_for_wellbeing
      group: reciprocity
      variable: Q47C
      codes: [4, 5]
      code_labels: "1=Strongly disagree, 2=Disagree, 3=Neither agree nor disagree, 4=Agree, 5=Strongly agree, 8=Refused, 9=Don't know"
      meaning: "Agree or strongly agree that the government usually uses tax revenues for the well-being of citizens"
      question: "Do you agree or disagree with each of the following statements: The government usually uses the tax revenues it collects for the well-being of citizens."
    - id: listen_mps_often_always
      group: reciprocity
      variable: Q38A
      codes: [2, 3]
      code_labels: "0=Never, 1=Only sometimes, 2=Often, 3=Always, 8=Refused, 9=Don't know"
      meaning: "Thinks Members of Parliament often or always try their best to listen to what people like them have to say"
      question: "How much of the time do you think the following try their best to listen to what people like you have to say: Members of Parliament?"
    - id: listen_councillors_often_always
      group: reciprocity
      variable: Q38B
      codes: [2, 3]
      code_labels: "0=Never, 1=Only sometimes, 2=Often, 3=Always, 8=Refused, 9=Don't know"
      meaning: "Thinks local government councillors often or always try their best to listen to what people like them have to say"
      question: "How much of the time do you think the following try their best to listen to what people like you have to say: Local government councilors?"
    - id: prefers_higher_taxes_more_services
      group: fiscal_exchange
      variable: Q45
      codes: [1, 2]
      code_labels: "1=Agree very strongly with Statement 1, 2=Agree with Statement 1, 3=Agree with Statement 2, 4=Agree very strongly with Statement 2, 5=Agree with neither, 8=Refused, 9=Don't know"
      meaning: "Prefers paying higher taxes if that means more government services (supporting indicator)"
      question: "Now let us talk about the tax system in this country. Which of the following statements is closest to your view? Statement 1: It is better to pay higher taxes if it means that there will be more services provided by government. Statement 2: It is better to pay lower taxes, even if it means there will be fewer services provided by government."
    - id: finding_out_taxes_difficult
      group: fiscal_exchange
      variable: Q46A
      codes: [3, 4]
      code_labels: "1=Very easy, 2=Easy, 3=Difficult, 4=Very difficult, 8=Refused, 9=Don't know"
      meaning: "Finds it difficult or very difficult to find out what taxes or fees one has to pay (supporting indicator; candidate for the 'simplicity' baseline, not mapped)"
      question: "Based on your experience, how easy or difficult is it to do each of the following: To find out what taxes and fees you are supposed to pay to the government?"
  gap_definitions:       # the report's 28 pp gap = 71% civic duty minus 43% "government listens"
    - {civic_duty: civic_duty_always_pay, reciprocity: listen_mps_often_always}
    - {civic_duty: civic_duty_always_pay, reciprocity: listen_councillors_often_always}
    - {civic_duty: civic_duty_always_pay, reciprocity: reciprocity_taxes_used_for_wellbeing}
  baseline_mapping:      # tax_morale.baseline.* constants (scores on 0-1): data where a defensible mapping exists
    trust:
      variable: Q41J
      valid_min: 0
      valid_max: 3
      direction: forward
      rescale: "(code - 0) / 3"
      previous_typed_value: 0.35
      rationale: "Direct match: the driver is trust in the tax system; Q41J asks how much the respondent trusts the tax/revenue office."
    social_norm:
      variable: Q47D
      valid_min: 0
      valid_max: 3
      direction: reverse
      rescale: "1 - (code - 0) / 3, i.e. 1 = people never avoid paying tax"
      previous_typed_value: 0.30
      rationale: "The driver is the community norm of compliance; Q47D records how often people in the country avoid paying the taxes they owe, a descriptive norm (reversed so that 1 = others comply). The injunctive norm (Q76e-tan) is reported as a component but not used."
    fairness:
      variable: Q47C
      valid_min: 1
      valid_max: 5
      direction: forward
      rescale: "(code - 1) / 4"
      previous_typed_value: 0.30
      rationale: "The code's own gloss for the driver is 'perceived value for tax paid'; Q47C asks whether the government usually uses tax revenues for the well-being of citizens."
    simplicity:
      variable: Q46A
      valid_min: 1
      valid_max: 4
      direction: reverse
      rescale: "1 - (code - 1) / 3, i.e. 1 = very easy to find out what taxes and fees to pay, 0 = very difficult"
      previous_typed_value: 0.25
      label: "information burden only (does not cover registration or filing costs)"
      rationale: "Decision of the owner (Block E2.0): the simplicity driver is mapped to Afrobarometer Q46a (how easy or difficult it is to find out what taxes and fees you are supposed to pay to the government), reversed and rescaled 0-1. It measures the information burden only; it does not cover the cost of registering or filing, which the model's simplification interventions (USSD registration, presumptive tax) target."
    enforcement:
      variable: null
      candidate_variable: Q40G
      previous_typed_value: 0.40
      rationale: "NOT MAPPED after the Block E2.1 search (kept as an ASSUMPTION for the owner's sign-off). Searched: the Afrobarometer Round 8 merged and Tanzania codebooks (every item mentioning tax with audit, penalty, punish, caught, enforce, detect, inspect, fine, prosecute, likely, evade, avoid: only Q47D 'how often do people avoid paying taxes' and, without the word tax, Q40G 'how often do ordinary people who break the law go unpunished' and Q40F 'officials who commit crimes go unpunished'); the FinScope 2023 data map (no item on audit, penalty or enforcement; the only tax item is the TIN document c27__13); the ILFS 2024 variable labels (no item on audit, inspection or penalty); TRA publications reachable on 2026-11-12 (Sixth Corporate Plan revised June 2024: KPI 'share of tax revenue from additional assessments raised in tax audits' 17.0% baseline, 14.5% actual 2022/23; no audit count, audit coverage rate or penalty amount; the TRA annual reports could not be located) and the NBS Tax Statistics Reports 2022/23 and 2023/24 (no audit data). Q40G is the closest survey item (perceived impunity of lawbreakers, general, reversed: unpunished -> weak enforcement) but it is not about tax; the audit-yield KPI is an outcome share of revenue, not a probability of being audited. Neither measures the perceived or actual likelihood of detection and penalty for not paying tax."

# E5: agent trust, morale and income from survey aggregates (src/03_features/agent_inputs.py)
agent_inputs:
  trust_morale:
    trust:
      variable: Q41J
      valid_min: 0
      valid_max: 3
      rescale: "(code - 0) / 3"
      meaning: "trust in the tax/revenue office (0 = not at all, 1 = a lot)"
    morale:
      variable: Q76E_TAN
      valid_min: 1
      valid_max: 3
      rescale: "(code - 1) / 2"
      meaning: "civic duty to pay tax: good citizens should pay the taxes they owe (0 = never do, 0.5 = only if they choose, 1 = always do)"
  income:
    age: Q06B_MEM_AGE
    weight: WEIGHT
    employee_cash: Q86B_CASH
    self_net: Q87D_TSH
    self_period: Q87D_PERIOD
    agri_net: Q88D_TSH
    agri_period: Q88D_PRIOD

# E6: statistical zones (region -> zone) for the Mzani wa Kodi fallback when a region x activity cell is suppressed.
zones:
  source: "National Bureau of Statistics (NBS) and OCGS: The 2022 Tanzania Demographic and Health Survey and Malaria Indicator Survey (TDHS-MIS), sampling procedure: 'To estimate geographic differentials for certain demographic indicators, Tanzania was divided into nine geographic zones.' The survey notes that these zones are not official administrative areas and that the Ministry of Health's Reproductive and Child Health Section uses the same classification; grouping regions into zones gives larger denominators and smaller sampling errors."
  url: "https://microdata.nbs.go.tz/index.php/metadata/export/38/json"
  accessed: "2026-11-12"
  regions:
    Western: [Tabora, Kigoma]
    Northern: [Kilimanjaro, Tanga, Arusha]
    Central: [Dodoma, Singida, Manyara]
    Southern Highlands: [Iringa, Njombe, Ruvuma]
    Southern: [Lindi, Mtwara]
    Southwest Highlands: [Mbeya, Rukwa, Katavi, Songwe]
    Lake: [Kagera, Mwanza, Geita, Mara, Simiyu, Shinyanga]
    Eastern: [Dar es Salaam, Pwani, Morogoro]
    Zanzibar: [Kaskazini Unguja, Kusini Unguja, Mjini Magharibi, Kaskazini Pemba, Kusini Pemba]

# E2.2: TRA registered taxpayers and digital-twin base parameters (src/03_features/twin_inputs.py).
# Published figures are transcribed here WITH their provenance; tests/test_tra_series.py re-reads the saved source documents in data/raw/ and checks every value.
twin_inputs:
  base_year: 2024
  census_year: 2022
  growth_years: 5                     # averages of the last 5 years with data (WDI GDP growth, population growth)
  working_age: [15, 64]               # ILO working-age convention, ages inclusive
  tra_registered_taxpayers:
    definition: "Registered taxpayers = taxpayers registered with the Tanzania Revenue Authority (TIN holders on TRA's register), Tanzania MAINLAND only (Zanzibar is administered by ZRA), as a STOCK at the end of the fiscal year (July-June), in thousands. NBS reproduces TRA's figure and does not say whether non-business TINs, entities and dormant TINs are included: it is a count of TIN registrations, not of active or filing taxpayers and not of adults. It is therefore NOT comparable with FinScope's 1.31 million adult TIN holders (a survey estimate of ADULTS who say they hold a TIN, Mainland and Zanzibar)."
    documents:
      nbs_2223: {title: "Tax Statistics Report 2022/23, Mainland Tanzania (NBS; source TRA 2023)", file: "data/raw/nbs/tax_statistics_mainland_2022_23.pdf", url: "https://www.nbs.go.tz/uploads/statistics/documents/en-1728393057-Tax%20Statistics%20Report,%202022_%202023%20-Mainland%20Tanzania%20.pdf", table: "Table 3.1", pdf_page: 39}
      nbs_2324: {title: "Tax Statistics Report 2023/24, Mainland Tanzania (NBS; source TRA 2023/24)", file: "data/raw/nbs/tax_statistics_mainland_2023_24.pdf", url: "https://www.nbs.go.tz/uploads/statistics/documents/en-1783961210-TAX%20STATISTICS_MAINLAND%20TANZANIA_REPORT%202023%20-%2024%20.pdf", table: "Table 3.1 (printed p. 14)", pdf_page: 31}
    series:                           # fiscal year, thousands, document; the latest vintage is used where two exist
      - {fy: "2011/12", thousands: 1036, doc: nbs_2223}
      - {fy: "2012/13", thousands: 1612, doc: nbs_2223}
      - {fy: "2013/14", thousands: 1784, doc: nbs_2223}
      - {fy: "2014/15", thousands: 1990, doc: nbs_2223}
      - {fy: "2015/16", thousands: 2200, doc: nbs_2223}
      - {fy: "2016/17", thousands: 2501, doc: nbs_2223}
      - {fy: "2017/18", thousands: 2739, doc: nbs_2324}
      - {fy: "2018/19", thousands: 2917, doc: nbs_2324}
      - {fy: "2019/20", thousands: 3181, doc: nbs_2324}
      - {fy: "2020/21", thousands: 4107, doc: nbs_2324}
      - {fy: "2021/22", thousands: 4455, doc: nbs_2324}
      - {fy: "2022/23", thousands: 5494, doc: nbs_2324}
      - {fy: "2023/24", thousands: 6272, doc: nbs_2324}
    superseded:                       # earlier vintages of the same year (kept visible, not used)
      - {fy: "2017/18", thousands: 2739, doc: nbs_2223}
      - {fy: "2022/23", thousands: 4697, doc: nbs_2223, note: "the 2023/24 report restates 2022/23 as 5,494 (+17%); no reason is given"}
    tra_cp6:                          # TRA Sixth Corporate Plan (revised June 2024), KPI table, printed p. 51 (PDF p. 67): definitions of ACTIVE and DORMANT business TINs
      file: "data/raw/tra/6th_CORPORATE_PLAN.pdf"
      pdf_page: 67
      note: "KPI 'Number of registered taxpayers - Active: total registered active business excluding non-business TIN; a physical count of Business TIN that transacted within a year' and 'Dormant: business TIN that did not transact within a year'. Columns as I read the table: baseline 2020/21, outturn 2021/22, target 2022/23, actual 2022/23. The 2022/23 actual (1,655,920) is far below the 2021/22 outturn (3,336,777): a change of definition or measurement is implied; the plan does not explain it."
      active_business_tin: {"2020/21": 3157106, "2021/22": 3336777, "2022/23_actual": 1655920}
      dormant_business_tin: {"2020/21": 824162, "2021/22": 780000, "2022/23_actual": 131888}
