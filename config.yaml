# so that nothing disappears without a record. docs/assumptions_register.csv lists them with basis_class RETIRED.
# No code reads this block.
# ---------------------------------------------------------------------------------------------------------------------
  # ---- Block E2.5: Table 40 stage economics (src/04_models/stage_economics.py). Costs are the report's own figures (submission_v1 PDF p. 52); reach, uptake and risk
  # distributions are ASSUMPTIONS for the owner's sign-off; the tax schedules are statute (DATA); revenue per registrant is derived from them and ILFS earnings.
  stage.cost.seed_tzs:
    value: [260000000, 1060000000]
    basis: ASSUMPTION
    source: "Seed (Michezo ya Kodi) cost range stated in the report's Table 40 (submission_v1 PDF p. 52: 260M-1.06B); drawn uniformly between the bounds. Report-stated figure, not independently sourced."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  stage.cost.entry_tzs:
    value: 420000000
    basis: ASSUMPTION
    source: "Entry (Targeting tool) cost stated in the report's Table 40 (submission_v1 PDF p. 52: 420M); treated as the whole programme cost, incurred at the start of year 1. Report-stated figure, not independently sourced."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  stage.cost.active_tzs:
    value: 600000000
    basis: ASSUMPTION
    source: "Active (Band calculator) cost stated in the report's Table 40 (submission_v1 PDF p. 52: 600M); whole programme cost at the start of year 1."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  stage.cost.enterprise_tzs:
    value: 750000000
    basis: ASSUMPTION
    source: "Enterprise (Tier tool, Ngazi) cost stated in the report's Table 40 (submission_v1 PDF p. 52: 750M); whole programme cost at the start of year 1."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  stage.cost.legacy_tzs:
    value: 700000000
    basis: ASSUMPTION
    source: "Legacy (Urithi wa Kodi) cost stated in the report's Table 40 (submission_v1 PDF p. 52: 700M); whole programme cost at the start of year 1."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  stage.cost_overrun_sigma:
    value: 0.25
    basis: ASSUMPTION
    source: "Cost risk: each stated cost (except Seed, which has its own range) is multiplied by a log-normal factor with median 1 and this log-standard-deviation in the Monte Carlo. A design choice; no cost-overrun data are held."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  stage.reach_share:
    value: {entry: [0.02, 0.05, 0.10], active: [0.01, 0.03, 0.08], enterprise: [0.01, 0.03, 0.08], asset: [0.005, 0.02, 0.05], legacy: [0.005, 0.02, 0.05]}
    basis: ASSUMPTION
    source: "Share of each stage's adult population (FinScope 2023: Entry 10.6M, Active 12.1M, Enterprise 3.5M, Asset 5.6M, Legacy 2.3M) actually reached by the tool within the ramp period: triangular (low, mode, high). Proposed values with the rationale that a digital nudge (Entry) can reach a larger share than officer-assisted tools (Active, Enterprise) or voluntary scores (Asset, Legacy); no uptake data exist for any of the tools. For the owner's sign-off."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  stage.intervention_for_uptake:
    value: {entry: USSD_registration_nudge, active: presumptive_tax_simplification, enterprise: community_compliance_norms, asset: visible_tax_returns, legacy: civic_tax_education}
    basis: ASSUMPTION
    source: "Which of the six morale-model interventions stands for each stage's tool when converting the recalibrated morale model into registrations (odds ratio at the stage's observed TIN rate, E2.3). A judgement mapping; Seed has no registrations claimed. For the owner's sign-off."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  stage.uptake_log_odds_sd:
    value: 0.3
    basis: ASSUMPTION
    source: "Uncertainty of the uptake effect: the log odds ratio of the mapped intervention gets a normal error with this standard deviation in the Monte Carlo (the odds ratios themselves are ASSUMPTION uplifts of the morale model)."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  stage.persistence:
    value: [0.5, 0.75, 0.9]
    basis: ASSUMPTION
    source: "Yearly persistence of a new registrant (share still compliant the next year): triangular (low, mode, high). No filing-persistence data exist in the project; for the owner's sign-off."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  stage.ramp_years:
    value: 5
    basis: ASSUMPTION
    source: "The reach of a tool is spread evenly over the first 5 years; registrants then persist (with the persistence rate) to the end of the horizon."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  stage.horizon_years:
    value: 10
    basis: ASSUMPTION
    source: "Evaluation horizon of Table 40: 10 years (brief E2.5)."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  stage.discount_rate:
    value: 0.10
    basis: ASSUMPTION
    source: "Discount rate 10% (brief E2.5), with sensitivities at 5% and 12%. Annuity factors are computed from the formula, never typed (the 4.33 used earlier for '10%' is the 5-year factor at 5%)."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  stage.discount_sensitivities:
    value: [0.05, 0.12]
    basis: ASSUMPTION
    source: "Alternative discount rates reported next to the 10% base case."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
    signoff: "approved (John, 2026-11-12)"
  tax.pit_schedule:
    value: [[0, 0, 0.0], [3240000, 0, 0.08], [6240000, 240000, 0.20], [9120000, 816000, 0.25], [12000000, 1536000, 0.30]]
    basis: DATA
    source: "Resident individual income tax, annual total income: [lower bound, tax at the bound, marginal rate]: nil to 3,240,000; 8% of the excess to 6,240,000; 240,000 + 20% to 9,120,000; 816,000 + 25% to 12,000,000; 1,536,000 + 30% above. Income Tax Act Cap. 332 R.E. 2023, First Schedule para 1(1), printed p. 675 (PDF p. 131), data/raw/tra/The_Income_Tax_Act.pdf. Amendments by later Finance Acts were not checked (the Finance Act 2025 text holds no change to this paragraph). Checked against the Finance Acts 2024, 2025 and 2026 (data/raw/tra/): none amends paragraph 1 of the First Schedule, so the schedule is unchanged in 2026/27. (TRA, Taxes and Duties at a Glance 2025/26, p. 7 shows the same table monthly.)"
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
  tax.presumptive_schedule:
    value: {threshold_turnover: 200000000, bands: [[4000000, 7000000, 100000, 0, 0.03], [7000000, 11000000, 250000, 90000, 0.03]], above_11m_rate: 0.04}
    basis: DATA
    source: "Presumptive income tax for resident individuals (First Schedule para 2(3) of the Income Tax Act Cap. 332), schedule in force from 1 July 2026 (Finance Act 2026, s. 27, PDF pp. 31-32; data/raw/tra/THE_FINANCE_ACT,_2026.pdf): nil up to TZS 4,000,000; 4-7M: TZS 100,000 (section 43 of the Tax Administration Act not complied with) or 3% of the turnover above 4M (complied with); 7-11M: TZS 250,000 or 90,000 + 3% of the turnover above 7M; above 11M up to the ceiling of TZS 200,000,000 (raised from 100,000,000): 4.0% of turnover (was 3.5%). The Finance Act 2026 also makes the tax NIL for the first twelve months from obtaining a TIN for an individual who obtains it to commence a business (on application to the Commissioner): NOT applied in the headline (the modelled registrants are existing informal workers and owners); Table 40 reports it as a sensitivity. The Finance Acts 2024 and 2025 did not change this table. Earlier schedule (R.E. 2023): ceiling 100M, 3.5%."
    feeds: "C041-C053 (Table 40)"
    group: stage_economics
