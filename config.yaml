    source: "FinScope Tanzania 2023, weighted number of adults aged 16 and over (34.1 million; Mainland and Zanzibar), computed in the pipeline (src/03_features/twin_inputs.py). The universe of the twin's registrations and mobile-money users, which can never exceed it (Block E3.3)."
