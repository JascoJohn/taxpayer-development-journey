interventions:
- stage: seed
  name: Michezo ya Kodi (Tax Learning Games)
  old_names:
  - Madarasa Ya Kodi
  mechanism: A gamified digital learning platform developed and promoted by TRA, designed to create familiarity with taxes before tax obligations begin.
  target_group: children aged 6-15 (the Seed age band, config.yaml seed_age_band)
  cost_reference:
    source: programme cost assumption (signed off; composition not recorded)
    stated: true
    cost_tzs: null
    cost_range_tzs:
    - 260000000
    - 1060000000
  report_pdf_page: 17
  morale_model_key: null
- stage: entry
  name: Ujumuishaji wa Kikodi (Taxpayer Targeting and Registration Tool)
  old_names:
  - Targeting Priority Tool (for Smart USSD Registration)
  - Targeting tool
  mechanism: 'TRA reaches young people through mobile money: a USSD prompt invites registration for a TIN, and registration on the Ngazi Platform is a second registration
    channel; the tool prioritises whom to reach.'
  target_group: young adults aged 16-24 (FinScope Entry segment)
  cost_reference:
    source: programme cost assumption (signed off; composition not recorded)
    stated: true
    cost_tzs: 420000000
    cost_range_tzs: null
  report_pdf_page: 23
  morale_model_key: USSD_registration_nudge
- stage: active
  name: Mzani wa Kodi (Presumptive Tax Estimator)
  old_names:
  - Mzani wa Kodi (Presumptive Tax Reference Tool)
  - Band calculator
  mechanism: 'A data-driven presumptive tax reference system built from FinScope microdata: indicative turnover bands by region and primary economic activity, an
    empirical benchmark for assessments.'
  target_group: adults aged 25-44 who are not business owners (FinScope Active segment)
  cost_reference:
    source: programme cost assumption (signed off; composition not recorded)
    stated: true
    cost_tzs: 600000000
    cost_range_tzs: null
  report_pdf_page: 29
  morale_model_key: presumptive_tax_simplification
- stage: enterprise
  name: Hatua za Kodi (Tax Progression Dashboard)
  old_names:
  - Ngazi Progression Dashboard
  - Tier tool (Ngazi)
  mechanism: 'A digital taxpayer progression platform: a visible progression pathway over the existing compliance framework; businesses unlock recognition and selected
    TRA service benefits as they meet compliance milestones.'
  target_group: business owners aged 25-64 (FinScope Enterprise segment)
  cost_reference:
    source: programme cost assumption (signed off; composition not recorded)
    stated: true
    cost_tzs: 750000000
    cost_range_tzs: null
  report_pdf_page: 35
  morale_model_key: community_compliance_norms
- stage: asset
  name: Mali-Alama za Kodi (Tax Asset Score)
  old_names:
  - Mali Alama (Asset Score)
  - Asset Score
  mechanism: A verified ownership credibility rating built from a citizen's history of declared and verifiable asset ownership; it rewards transparency, not wealth.
  target_group: adults aged 45-64 who are not business owners (FinScope Asset segment)
  cost_reference:
    source: programme cost assumption (signed off; composition not recorded)
    stated: false
    note: no cost stated in the report ('Not yet modeled')
  report_pdf_page: 40
  morale_model_key: visible_tax_returns
- stage: legacy
  name: Urithi wa Kodi (Tax Legacy Score)
  old_names:
  - Kodi Legacy Score and Succession Builder
  - Kodi Legacy Score
  mechanism: A lifetime compliance index that preserves a taxpayer's verified compliance history and enables its structured transfer to an approved successor.
  target_group: adults aged 65 and over (FinScope Legacy segment)
  cost_reference:
    source: programme cost assumption (signed off; composition not recorded)
    stated: true
    cost_tzs: 700000000
    cost_range_tzs: null
  report_pdf_page: 47
  morale_model_key: civic_tax_education
